name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pyflakes + pytest (pipeline, core, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes shipdoc_core pipeline api scripts
      # rules only, memory store, inline tasks: no network, no credentials, no dataset
      - run: python -m pytest tests/ -q
        env:
          STORE: memory
          TASKS_MODE: inline
          VISION: "off"

  web:
    name: console type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_BASE: https://shipdoc-api-705106212012.asia-southeast1.run.app
